; Open this folder in PlatformIO (the folder that contains this file).
; The Arduino sketch is the source directory so one copy of the firmware
; builds in both PlatformIO and the Arduino IDE.

[platformio]
src_dir = ESP32_Educational_WiFi_Lab

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
